name: 🖼️ Image Battle Weekly

# 🔥 ДОБАВЬТЕ ЭТОТ БЛОК: даем права на запись в репозиторий
permissions:
  contents: write

on:
  schedule:
    - cron: '0 18 * * 5' # Каждую пн, ср,пятница, сб в 18:00 UTC
  workflow_dispatch:     # Ручной запуск

jobs:
  image-battle:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Важно для последующего git push

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎨 Generate and Post Image Battle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python image_battle.py

      - name: 📝 Commit and push images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          # Делаем коммит только если есть изменения
          if ! git diff --staged --quiet; then
            git commit -m "📸 New Image Battle: $(date +'%Y-%m-%d')"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
