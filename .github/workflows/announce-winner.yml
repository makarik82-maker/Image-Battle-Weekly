name: 🏆 Announce Winner

on:
  schedule:
    # Запускается каждый понедельник в 18:00 UTC (через 3 дня после пятничной битвы)
    - cron: '0 18 * * 1,2,4,6'
  workflow_dispatch:  # Ручной запуск для тестирования

jobs:
  announce-winner:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получаем всю историю для доступа к файлам битвы

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏆 Analyze and Announce Winner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python announce_winner.py
